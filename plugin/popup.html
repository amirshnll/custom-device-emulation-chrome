<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Custom Device Emulation Chrome</title>
</head>

<body>
    <div id="app">
        <img src="icon48.png" alt="Custom Device Emulation Chrome" title="Custom Device Emulation Chrome" class="app-icon" />

        <h1>Custom Device Emulation Chrome</h1>

        <div class="controls">
            <select aria-label="Device type" id="category" class="control">
                <option value="desktop">Desktop</option>
                <option value="tablet">Tablet</option>
                <option value="mobile">Mobile</option>
            </select>
            <input type="text" aria-label="Search devices" id="search" class="control" placeholder="Search for a device..." />
        </div>

        <p id="data-status" role="status"></p>
        <div id="results" class="results"></div>

        <footer id="footer">
            <p>
                ©<span id="year"></span>
                <a href="https://github.com/amirshnll/custom-device-emulation-chrome" target="_blank">Custom Device Emulation Chrome</a> | MIT License | 1.4.0 | <a href="https://ashokri.com/donate" target="_blank" title="Donate">Donate</a>.
            </p>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
